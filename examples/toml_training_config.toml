[model]
type = "GATBiLSTMNet"

[model.params]
input_dim = 4
output_dim = 1
use_preprocessing = false
temporal_mode = "none"
gat_hidden_dim = 4
gat_heads = 1
num_gat_layers = 1
dropout_prob = 0.0
graph_pool = "mean"
head_hidden_dim = 4

[training]
epochs = 2
batch_size = 4
learning_rate = 0.005
weight_decay = 0.0
scheduler = "none"
early_stopping_patience = 0
save_dir = "./example_outputs/toml_training_config"
verbose = false
train_shuffle = false

[loss]
name = "mse"

[metrics]
names = ["mse", "rmse"]

[tracking]
enabled = false
