name: Validate documentation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: docs-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install ".[docs,all]"

      - name: Build Sphinx HTML
        working-directory: docs
        run: make html SPHINXOPTS="-W"

      - name: Validate repository documentation links
        working-directory: docs
        run: python -m sphinx -b linkcheck -W source _build/linkcheck
