[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phylognn"
version = "0.1.0"
description = "Convert phylogenetic trees to graph neural network data"
readme = "README.md"
requires-python = ">=3.12"
authors = [
{name = "Minghao Du", email = "du.minghao@outlook.com"}
]
dependencies = [
"torch>=2.0.0",
"torch-geometric>=2.3.0",
"torch-scatter>=2.1.0",
"torchmetrics>=1.0.0",
"entmax>=1.3",
"ete3>=3.1.0",
"numpy>=1.24.0",
"tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
"pytest>=7.0.0",
"black>=23.0.0",
"ruff>=0.1.0",
]
docs = [
"sphinx>=7.0.0",
"sphinx-rtd-theme>=2.0.0",
]
beast = [
"dendropy>=4.6.0",
]
examples = [
"matplotlib>=3.5.0",
]
wandb = [
"wandb>=0.16.0",
]
all = [
"dendropy>=4.6.0",
"matplotlib>=3.5.0",
"pandas>=2.0.0",
"wandb>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
target-version = "py38"
